<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Coffee</title>
</head>

<body>
    <header>
        <a href="" class="logo">
            <img src="img/logo.png" alt="logo">
        </a>

        <ul class="navlist">
            <li><a href="#">About</a></li>
            <li><a href="#">Membership</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="right-content">
            <a href="#" class="nav-btn">Sign-In</a>
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h5 data-aos="fade-right" , data-aos-duration="1400">#Coffee for hot days</h5>
            <h1 data-aos="zoom-in-left" , data-aos-duration="1400" , data-aos-delay="200">- Cold Brew</h1>
            <p data-aos="fade-right" , data-aos-duration="1400" , data-aos-delay="300">Boots your productivity and build
                your
                mood with a glass of coffee in the morning.
                Coffee has a simulating effect.</p>

            <div class="main-hero" data-aos="flip-down" , data-aos-duration="1400" , data-aos-delay="400">
                <a href="#" class="btn">Order Now</a>
                <a href="#" class="price">$16.00 |
                    <span>Regular Price</span></a>
            </div>
        </div>

        <div class="hero-img" , data-aos="zoom-in" , data-aos-duration="1400">
            <img src="img/hero.png" alt="">
        </div>
    </section>

    <div class="icons">
        <a href="#" data-aos="fade-in" , data-aos-duration="1400" , data-aos-delay="600"><i
                class="ri-facebook-fill"></i></a>
        <a href="#" data-aos="fade-in" , data-aos-duration="1400" , data-aos-delay="700"><i
                class="ri-youtube-fill"></i></a>
        <a href="#" data-aos="fade-in" , data-aos-duration="1400" , data-aos-delay="800"><i
                class="ri-twitter-x-fill"></i></a>
    </div>

    <div class="scroll" data-aos="zoom-out-down" , data-aos-duration="1400" , data-aos-delay="550">
        <a href="#"><i class="ri-arrow-down-double-fill"></i>
            Scroll down</a>
    </div>

    <script src="script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            offset: 1,
        });
    </script>

</body>

</html>
